let currentIdx = 0;
let score = 0;

function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById("current-count").innerText = currentIdx + 1;
    document.getElementById("total-count").innerText = quizData.length;
    document.getElementById("question").innerText = q.q;
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    
    q.a.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAns(i, btn);
        optionsDiv.appendChild(btn);
    });
}

function checkAns(idx, btn) {
    const correct = quizData[currentIdx].c;
    const allBtns = document.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true); // Disable all buttons so you can't click twice
    
    if(idx === correct) {
        btn.classList.add("correct");
        score++;
        document.getElementById("score").innerText = score;
    } else {
        btn.classList.add("wrong");
        allBtns[correct].classList.add("correct");
    }

    // AUTOMATICALLY GO TO NEXT QUESTION AFTER 1 SECOND (1000ms)
    setTimeout(() => {
        currentIdx++;
        if(currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }, 1000); 
}

function showResults() {
    document.getElementById("options").style.display = "none";
    document.getElementById("question").style.display = "none";
    document.getElementById("final-result").style.display = "block";
    document.getElementById("total-score").innerText = score + " / " + quizData.length;
}

// Start the quiz
loadQuestion();
</script>
